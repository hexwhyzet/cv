<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Fullscreen PDF</title>
  <style>
    /* Убираем все отступы и скроллы у html/body */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    /* Растягиваем pdf-объект на весь экран */
    object {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <object data="./CV/Kabakov.pdf" type="application/pdf">
    <p>Ваш браузер не поддерживает встроенные PDF. 
       <a href="./CV/Kabakov.pdf">Скачать файл</a>
    </p>
  </object>
</body>
</html>
